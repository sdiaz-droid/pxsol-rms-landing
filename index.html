// ─── Page header — Device variant (browser mock + AgentScene) ──────────
function PxPageHeader({ speed }) {
  const wideRef   = React.useRef(null);
  const deviceRef = React.useRef(null);

  React.useEffect(() => {
    const wide   = wideRef.current;
    const device = deviceRef.current;
    if (!wide || !device) return;
    let raf = 0;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const rect  = wide.getBoundingClientRect();
        const vh    = window.innerHeight || 1;
        const total = vh + rect.height;
        const t     = 1 - Math.max(0, Math.min(1, rect.bottom / total));
        device.style.transform    = `translateY(${(1-t)*28}px) scale(${0.92 + t*0.14})`;
        device.style.borderRadius = `${26 - t*14}px`;
      });
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return (
    <section
      className="px-pageHeader px-pageHeader--device"
      style={{ '--product-color': 'var(--product-rms-color)' }}

            <p>

// ─── Sticky features — ClickUp-style scroll effect ──────────────────────
function StickyFeatures() {
  React.useEffect(() => {
    const triggers = document.querySelectorAll('.sf-trigger');
    const screens  = document.querySelectorAll('.sf-screen');
    const dots     = document.querySelectorAll('.sf-dot');

    // ── Calendar cursor ──
    const calTargets = [
      { sel: '[data-sf-day="hi1"]',  label: 'alta demanda' },
      { sel: '[data-sf-day="pk1"]',  label: 'pico' },
      { sel: '[data-sf-day="td"]',   label: 'hoy · +11%' },
      { sel: '[data-sf-day="pk2"]',  label: 'finde largo ↑' },
    ];
    let calIdx = 0;
    let calTimer = null;

    function moveCursor() {
      const screen1 = document.getElementById('screen-1');
      const cursor  = document.getElementById('sf-cal-cursor');
      const lbl     = document.getElementById('sf-cal-cursor-lbl');
      if (!screen1 || !cursor) return;
      if (!screen1.classList.contains('active')) {
        cursor.classList.remove('sf-cal-cursor--visible');
        return;
      }
      const t    = calTargets[calIdx];
      const cell = screen1.querySelector(t.sel);
      const wrap = document.getElementById('sf-cal-grid-wrap');
      if (cell && wrap) {
        const wr = wrap.getBoundingClientRect();
        const cr = cell.getBoundingClientRect();
        cursor.style.left   = (cr.left - wr.left - 4) + 'px';
        cursor.style.top    = (cr.top  - wr.top  - 4) + 'px';
        cursor.style.width  = (cr.width  + 8) + 'px';
        cursor.style.height = (cr.height + 8) + 'px';
        if (lbl) lbl.textContent = t.label;
        cursor.classList.add('sf-cal-cursor--visible');
      }
      calIdx = (calIdx + 1) % calTargets.length;
    }

    function startCalCursor() {
      calIdx = 0;
      clearInterval(calTimer);
      setTimeout(() => {
        moveCursor();
        calTimer = setInterval(moveCursor, 1600);
      }, 700);
    }

    function stopCalCursor() {
      clearInterval(calTimer);
      const cursor = document.getElementById('sf-cal-cursor');
      if (cursor) cursor.classList.remove('sf-cal-cursor--visible');
    }

    function activateFeature(i) {
      triggers.forEach((t, ti) => t.classList.toggle('active', ti === i));
      screens.forEach((s, si) => {
        if (si === i) s.classList.add('active');
        else          s.classList.remove('active');
      });
      dots.forEach((d, di) => d.classList.toggle('active', di === i));
      if (i === 1) startCalCursor();
      else         stopCalCursor();
    }

    activateFeature(0);

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) activateFeature(+e.target.dataset.index);
      });
    }, { threshold: .5 });

    triggers.forEach(t => obs.observe(t));
    return () => { obs.disconnect(); clearInterval(calTimer); };
  }, []);

  return (
    <React.Fragment>
      {/* ── Intro heading ── */}
      <div className="sf-intro-wrap" data-screen-label="02 Features">
        <div className="sf-intro-inner">
          <div className="px-section__eyebrow" style={{ justifyContent: 'center' }}>Funcionalidades</div>
          <h2 className="sf-intro-title">
            Todo lo que necesitás para <em>optimizar</em> tus ingresos
          </h2>
        </div>
      </div>

      {/* ── Desktop sticky layout ── */}
      <div className="sf-section" id="sf-section">

        {/* Left: scroll triggers */}
        <div className="sf-left">
          <div className="sf-trigger" data-index="0">
            <div>
              <div className="sf-num">01</div>
              <span className="sf-tag">Inteligencia competitiva</span>
              <h3 className="sf-title">Compset en <em>tiempo real</em></h3>
              <p className="sf-desc">Sabés exactamente a qué precio están tus competidores en cada fecha, sin entrar a Booking ni abrir una pestaña extra.</p>
              <a href={DEMO_URL} className="px-btn --primary sf-trigger-cta">
                <span>Ver demo <ArrowRight size={14} strokeWidth={1.75} aria-hidden="true" /></span>
              </a>
            </div>
          </div>
          <div className="sf-trigger" data-index="1">
            <div>
              <div className="sf-num">02</div>
              <span className="sf-tag">Calendario dinámico</span>
              <h3 className="sf-title">Precios por fecha, <em>siempre al día</em></h3>
              <p className="sf-desc">Vista mensual con color por nivel de demanda. Los ajustes se propagan a todos tus canales en tiempo real, sin intervención manual.</p>
              <a href={DEMO_URL} className="px-btn --primary sf-trigger-cta">
                <span>Ver demo <ArrowRight size={14} strokeWidth={1.75} aria-hidden="true" /></span>
              </a>
            </div>
          </div>
          <div className="sf-trigger" data-index="2">
            <div>
              <div className="sf-num">03</div>
              <span className="sf-tag">Automatización</span>
              <h3 className="sf-title">Reglas que trabajan <em>mientras dormís</em></h3>
              <p className="sf-desc">Configurás una vez: si la ocupación supera X%, la tarifa sube automáticamente. Podés definir reglas por fecha, evento o umbral de pickup.</p>
              <a href={DEMO_URL} className="px-btn --primary sf-trigger-cta">

              </a>
            </div>
          </div>
        </div>

        {/* Right: sticky panel */}
        <div className="sf-right" id="sf-right">

  '¿Qué eventos detectás para junio?': 'Detecté 3 eventos: Festival de Jazz 6–8 jun (demanda alta), feriado nacional 20 jun, y Congreso de Turismo 25–27 jun. Para los 3 ya tengo sugerencias preparadas. ¿Querés que te las muestre ahora?',
  '¿Cuál fue tu mejor decisión?': 'El 10 de mayo, con 9 días de anticipación, subí a ARS 108k para el finde 17–18. El set comp. tardó 2 días en seguirme. Esas 2 noches generaron ARS 384k extra — 19% sobre lo proyectado. Una de las mejores ventanas del mes.',
  '¿Cuándo necesito aprobar algo?': 'Ahora mismo hay 3 sugerencias esperando tu aprobación: 2 para el finde del 24–25 (Alta confianza, dentro de tus bordes) y 1 para el 1–2 jun (Confianza media — esta te la mando para que decidas vos).',
};

const AGD_INITIAL_MESSAGES = [
  { type: 'agent', text: '¡Hola! Soy el Agente RMS de Hotel Andina. Esta semana apliqué 12 cambios de tarifa — ¿en qué puedo ayudarte?' }
];

function AgentIADark() {
  const [step, setStep] = React.useState(0);
  const [messages, setMessages] = React.useState(AGD_INITIAL_MESSAGES);
  const [isTyping, setIsTyping] = React.useState(false);
  const [reasonStep, setReasonStep] = React.useState(0);
  const chatFeedRef = React.useRef(null);

  React.useEffect(() => {
    const timer = setInterval(() => setStep(s => (s + 1) % 3), 3600);
    return () => clearInterval(timer);
  }, []);

  React.useEffect(() => {
    const timers = [0,1,2,3,4].map(i => setTimeout(() => setReasonStep(s => Math.max(s, i+1)), 600 + i*500));
    return () => timers.forEach(clearTimeout);
  }, []);

  React.useEffect(() => {
    if (chatFeedRef.current) {
      chatFeedRef.current.scrollTop = chatFeedRef.current.scrollHeight;
    }
  }, [messages, isTyping]);

  function handleChip(question) {
    if (isTyping) return;
    setMessages(m => [...m, { type: 'user', text: question }]);
    setIsTyping(true);
    setTimeout(() => {
      setIsTyping(false);
      setMessages(m => [...m, { type: 'agent', text: AGD_RESPONSES[question] || 'Déjame analizar eso...' }]);
    }, 900);
  }

  const suggestions = [
    { from: 'ARS 96.000', to: 'ARS 108.000', pct: '+12.5%', range: '15–17 may', rationale: 'Pickup +25% sobre histórico. Set comp. subió 8% ayer. Finde largo detectado.', impact: '+ARS 192.000', up: true },
    { from: 'ARS 84.000', to: 'ARS 96.000', pct: '+14.3%', range: '22–24 may', rationale: 'Finde largo confirmado. Demanda 2.3× histórico. 4 competidores ya ajustaron al alza.', impact: '+ARS 216.000', up: true },
    { from: 'ARS 102.000', to: 'ARS 118.000', pct: '+15.7%', range: '6–8 jun', rationale: 'Festival Regional. Demanda 3× histórico. Set comp. promedia ARS 124k.', impact: '+ARS 384.000', up: true },
  ];

  const activityLog = [
    { time: '04:23', icon: '↑', text: 'Subió 22–24 may · ARS 84k → 96k', badge: 'Aplicado', color: 'green' },
    { time: '03:47', icon: '⚡', text: 'Finde largo detectado · 15–17 may', badge: 'Detectado', color: 'purple' },
    { time: '02:15', icon: '🔍', text: '4 competidores escaneados · +8% promedio', badge: 'Analizado', color: 'blue' },
    { time: '01:58', icon: '↑', text: 'Ajustó 3 fechas de junio', badge: '+ARS 192k', color: 'green' },
    { time: '00:30', icon: '✓', text: 'Revisión nocturna · Sin alertas críticas', badge: 'OK', color: 'gray' },
  ];

  const reasoningSteps = [
    { icon: '📊', label: 'Pickup 24h', value: '+31%', sub: 'sobre histórico', color: '#4ade80' },
    { icon: '🏨', label: 'Set comp.', value: '+9%', sub: 'promedio subió', color: '#60a5fa' },
    { icon: '📅', label: 'Finde largo', value: '24–25 may', sub: 'confirmado', color: '#7c13cd' },
    { icon: '🎯', label: 'Asertividad', value: '94%', sub: '1.247 casos', color: '#fb923c' },
    { icon: '↗', label: 'Sugerencia', value: '+14.3%', sub: 'ARS 84k → 96k', color: '#4ade80', final: true },
  ];

  const s = suggestions[step];

  return (
    <section className="agd-section" data-screen-label="05 Agent">
      <div className="agd-glow agd-glow--1" aria-hidden="true" />
      <div className="agd-glow agd-glow--2" aria-hidden="true" />
      <div className="agd-glow agd-glow--3" aria-hidden="true" />

      <div className="agd-inner">

        {/* Header */}
        <div className="agd-header">
          <div className="agd-eyebrow-row">
            <span className="agd-eyebrow">Agente IA</span>
            <span className="agd-pill">● Enterprise</span>
          </div>
          <h2 className="agd-title">
            Un revenue manager<br/>que <em>nunca duerme.</em>
          </h2>
          <p className="agd-lede">
            Detecta el evento, evalúa tres escenarios y propone el cambio con su razonamiento completo.
            Cuando confías, lo aplica solo — dentro de los bordes que vos definiste.
          </p>
        </div>

        {/* Bento grid — 5 cells */}
        <div className="agd-bento">

          {/* Cell 1: Hub screenshot */}
          <div className="agd-bento-cell agd-bento-cell--hub">
            <div className="agd-cell-label agd-cell-label--over">Dashboard diario · Vista real</div>
            <img src="rms-agente-dashboard.png" alt="Dashboard diario de RMS" className="agd-hub-img" />
            <div className="agd-hub-overlay">
              <span className="agd-live-dot" />
              <span>78.4% ocupación · ARS 96k ADR · 94% asertividad</span>
            </div>
          </div>

          {/* Cell 2: Stats + bullets */}
          <div className="agd-bento-cell agd-bento-cell--stats">
            <div className="agd-cell-label">Esta semana el agente</div>
            <div className="agd-mini-stats">
              <div className="agd-mini-stat">
                <div className="agd-mini-n agd-count" data-target="12">0</div>
                <div className="agd-mini-l">cambios aplicados</div>
              </div>
              <div className="agd-mini-divider" />
              <div className="agd-mini-stat">
                <div className="agd-mini-n agd-mini-n--green">+ARS 340k</div>
                <div className="agd-mini-l">ingresos estimados</div>
              </div>
              <div className="agd-mini-divider" />
              <div className="agd-mini-stat">
                <div className="agd-mini-n">~6 h</div>
                <div className="agd-mini-l">horas ahorradas</div>
              </div>
            </div>
            <ul className="agd-bullets">
              {[
                ['Razonamiento completo', 'Cada cambio incluye motivo y evidencia.'],
                ['Bordes inviolables', 'Min/max y variación diaria — el agente nunca se sale.'],
                ['Aprende de tus decisiones', 'Mejora con cada aprobación y rechazo.'],
                ['Inteligencia colectiva', 'Se entrena también con patrones de hoteles similares.'],
              ].map(([t, d], i) => (
                <li key={i} className="agd-bullet">
                  <span className="agd-check" aria-hidden="true">
                    <AgdCheck size={10} strokeWidth={1.8} />
                  </span>
                  <div><strong>{t}</strong><span>{d}</span></div>
                </li>
              ))}
            </ul>
          </div>

          {/* Cell 3: Live suggestion (cycling) */}
          <div className="agd-bento-cell agd-bento-cell--suggest">
            <div className="agd-cell-label-row">
              <span className="agd-cell-label">Sugerencia activa</span>
              <span className="agd-cycle-dots" aria-hidden="true">
                {[0,1,2].map(i => <span key={i} className={`agd-cycle-dot${i===step?' active':''}`} />)}
              </span>
            </div>
            <div className="agd-suggest-card" key={step}>
              <div className="agd-suggest-top">
                <div className="agd-suggest-rate">
                  <span className={`agd-arrow${s.up?' up':' down'}`}>{s.up?'↑':'↓'}</span>
                  {s.from} → <strong>{s.to}</strong>
                  <span className={`agd-pct${s.up?' up':' down'}`}>{s.pct}</span>
                </div>
                <span className="agd-range-tag">· {s.range}</span>
              </div>
              <div className="agd-rationale">{s.rationale}</div>
              <div className="agd-suggest-foot">
                <span className="agd-impact-line">Impacto est. <strong>{s.impact}</strong></span>
                <div className="agd-suggest-btns">
                  <button className="agd-btn agd-btn--ghost">Rechazar</button>
                  <button className="agd-btn agd-btn--primary">Aprobar</button>
                </div>
              </div>
            </div>
            <div className="agd-conf-row">
              <span className="agd-conf-badge">
                <AgdClock size={9} strokeWidth={1} />
                Confianza Alta
              </span>
              <span className="agd-conf-text">Basado en 1.247 evaluaciones</span>
            </div>
          </div>

          {/* Cell 4: Activity log */}
          <div className="agd-bento-cell agd-bento-cell--activity">
            <div className="agd-cell-label">Registro de actividad · últimas 8 h</div>
            <div className="agd-activity-feed">
              {activityLog.map((item, i) => (
                <div key={i} className="agd-activity-item" style={{animationDelay: `${i * 120}ms`}}>
                  <div className="agd-activity-left">
                    <div className={`agd-activity-dot agd-activity-dot--${item.color}`} />
                    <div className="agd-activity-connector" />
                  </div>
                  <div className="agd-activity-body">
                    <div className="agd-activity-time">{item.time} AM</div>
                    <div className="agd-activity-text">{item.text}</div>
                  </div>
                  <span className={`agd-activity-badge agd-activity-badge--${item.color}`}>{item.badge}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Cell 5: AI Reasoning flow */}
          <div className="agd-bento-cell agd-bento-cell--reason">
            <div className="agd-cell-label">Cómo llegó a esta decisión</div>
            <div className="agd-reason-flow">
              {reasoningSteps.map((r, i) => (
                <div key={i} className={`agd-reason-step${reasonStep > i ? ' visible' : ''}${r.final ? ' agd-reason-step--final' : ''}`} style={{transitionDelay: `${i*80}ms`}}>
                  {!r.final && i > 0 && <div className="agd-reason-arrow">→</div>}
                  <div className="agd-reason-card" style={r.final ? {borderColor: 'rgba(73,37,152,0.5)', background: 'rgba(73,37,152,0.1)'} : {}}>
                    <div className="agd-reason-icon">{r.icon}</div>
                    <div className="agd-reason-value" style={{color: r.color}}>{r.value}</div>
                    <div className="agd-reason-label">{r.label}</div>
                    <div className="agd-reason-sub">{r.sub}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Cell 6: Interactive chat — full width */}
          <div className="agd-bento-cell agd-bento-cell--chat">
            <div className="agd-chat-header">
              <div className="agd-chat-title">
                <span className="agd-chat-bot-avatar" aria-hidden="true">
                  <AgdBot size={14} strokeWidth={1.6} />
                </span>
                Modo conversacional
                <span className="agd-chat-status">● Online</span>
              </div>
              <span className="agd-chat-hint">Hacé click en una pregunta para probar</span>
            </div>
            <div className="agd-chat-body">
              <div className="agd-chat-feed" ref={chatFeedRef}>
                {messages.map((m, i) => (
                  <div key={i} className={`agd-chat-msg agd-chat-msg--${m.type} visible`}>
                    {m.type === 'agent' && (
                      <span className="agd-bot-icon" aria-hidden="true">
                        <AgdBot size={11} strokeWidth={1.6} />
                      </span>
                    )}
                    <span>{m.text}</span>
                  </div>
                ))}
                {isTyping && (
                  <div className="agd-chat-msg agd-chat-msg--agent visible agd-typing-indicator">
                    <span className="agd-bot-icon" aria-hidden="true">
                      <AgdBot size={11} strokeWidth={1.6} />
                    </span>
                    <span className="agd-typing-dots">
                      <span /><span /><span />
                    </span>
                  </div>
                )}
              </div>
              <div className="agd-chat-sidebar">
                <div className="agd-chip-label">Preguntas frecuentes</div>
                <div className="agd-chip-list">
                  {Object.keys(AGD_RESPONSES).map(q => (
                    <button key={q} className={`agd-chip${isTyping?' agd-chip--disabled':''}`} onClick={() => handleChip(q)}>
                      {q}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>

        </div>

        {/* Stats strip */}
        <div className="agd-stats-strip">
          {[
            ['1.658', 'actualizaciones / mes'],
            ['94%', 'precisión en sugerencias'],
            ['+18.7%', 'RevPAR promedio vs sin RMS'],
            ['24/7', 'monitoreo continuo'],
          ].map(([n, l]) => (
            <div className="agd-stat" key={n}>
              <div className="agd-stat-n">{n}</div>
              <div className="agd-stat-l">{l}</div>
            </div>
          ))}
        </div>

      </div>
    </section>
  );
}
window.AgentIADark = AgentIADark;
</script>

<script type="text/babel">
function App() {
  const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.dark ? 'dark' : 'light');
  }, [t.dark]);

  const speed = t.speed === 'slow' ? 0.5 : t.speed === 'fast' ? 1.6 : 1;

  return (
    <div className="landing">
      <PxNavbar />
      <div className="px-hero-problem-wrap">
        <PxPageHeader speed={speed} />
        <PxProblem />
        <PxSocialProof />
      </div>
      <StickyFeatures />
      <PxWhatIs />
      <window.AgentIADark />
      <window.PxScenes speed={speed} />
      <window.PxBenefits />
      <window.PxFAQ />
      <window.PxCTA />
      <window.PxFooter />

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
