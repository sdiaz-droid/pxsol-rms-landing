// ─── Sticky features — ClickUp-style scroll effect ──────────────────────
function StickyFeatures() {
  React.useEffect(() => {
    const triggers = document.querySelectorAll('.sf-trigger');
    const screens  = document.querySelectorAll('.sf-screen');
    const dots     = document.querySelectorAll('.sf-dot');

    // ── Calendar cursor ──
    const calTargets = [
      { sel: '[data-sf-day="hi1"]',  label: 'alta demanda' },
      { sel: '[data-sf-day="pk1"]',  label: 'pico' },
      { sel: '[data-sf-day="td"]',   label: 'hoy · +11%' },
      { sel: '[data-sf-day="pk2"]',  label: 'finde largo ↑' },
    ];
    let calIdx = 0;
    let calTimer = null;

    function moveCursor() {
      const screen1 = document.getElementById('screen-1');
      const cursor  = document.getElementById('sf-cal-cursor');
      const lbl     = document.getElementById('sf-cal-cursor-lbl');
      if (!screen1 || !cursor) return;
      if (!screen1.classList.contains('active')) {
        cursor.classList.remove('sf-cal-cursor--visible');
        return;
      }
      const t    = calTargets[calIdx];
      const cell = screen1.querySelector(t.sel);
      const wrap = document.getElementById('sf-cal-grid-wrap');
      if (cell && wrap) {
        const wr = wrap.getBoundingClientRect();
        const cr = cell.getBoundingClientRect();
        cursor.style.left   = (cr.left - wr.left - 4) + 'px';
        cursor.style.top    = (cr.top  - wr.top  - 4) + 'px';
        cursor.style.width  = (cr.width  + 8) + 'px';
        cursor.style.height = (cr.height + 8) + 'px';
        if (lbl) lbl.textContent = t.label;
        cursor.classList.add('sf-cal-cursor--visible');
      }
      calIdx = (calIdx + 1) % calTargets.length;
    }

    function startCalCursor() {
      calIdx = 0;
      clearInterval(calTimer);
      setTimeout(() => {
        moveCursor();
        calTimer = setInterval(moveCursor, 1600);
      }, 700);
    }

    function stopCalCursor() {
      clearInterval(calTimer);
      const cursor = document.getElementById('sf-cal-cursor');
      if (cursor) cursor.classList.remove('sf-cal-cursor--visible');
    }

    function activateFeature(i) {
      triggers.forEach((t, ti) => t.classList.toggle('active', ti === i));
      screens.forEach((s, si) => {
        if (si === i) s.classList.add('active');
        else          s.classList.remove('active');
      });
      dots.forEach((d, di) => d.classList.toggle('active', di === i));
      if (i === 1) startCalCursor();
      else         stopCalCursor();
    }

    activateFeature(0);

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) activateFeature(+e.target.dataset.index);
      });
    }, { threshold: .5 });

    triggers.forEach(t => obs.observe(t));
    return () => { obs.disconnect(); clearInterval(calTimer); };
  }, []);
